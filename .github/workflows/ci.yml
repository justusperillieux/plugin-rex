name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Lua 5.1 formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check --syntax Lua51 bootstrap.lua plugin-rex.lua plugin-rex examples tests

  test:
    name: Rex integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Rex 0.1.0-preview.23, matching the runtime documented in README.md.
      REX_COMMIT: c67cc2d0c88ecc86f5d751079b809dd9e9047636
      REX_SHA256: 26575255ac9f4eee4e58a382f3a596bfe4ee01061aceaf9855e480b129d2862c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rex
        run: |
          curl -fsSL --retry 3 \
            "https://blob.superlogical.com/download/rex/preview/${REX_COMMIT}/rex-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/rex.tar.gz"
          printf '%s  %s\n' "$REX_SHA256" "$RUNNER_TEMP/rex.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/rex-bin"
          tar -xzf "$RUNNER_TEMP/rex.tar.gz" -C "$RUNNER_TEMP/rex-bin"
          echo "$RUNNER_TEMP/rex-bin" >> "$GITHUB_PATH"
          printf 'XDG_CONFIG_HOME=%s/rex-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'XDG_DATA_HOME=%s/rex-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'XDG_STATE_HOME=%s/rex-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify Rex version
        run: rex version
      - name: Check Rex configuration
        run: make check
      - name: Run manager and bootstrap tests
        run: make test
